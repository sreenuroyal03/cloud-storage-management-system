
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Storage System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>☁ Cloud Storage System</h1>
    <p>Manage your file records easily</p>
  </header>

  <main>
    <section class="card">
      <h2>Add a File Record</h2>
      <input id="fileName" type="text" placeholder="Enter file name">
      <input id="fileType" type="text" placeholder="Enter file type (PDF, JPG...)">
      <button id="addBtn">Add File</button>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Storage Dashboard</h2>
      <h3>Total file records: <span id="total">0</span></h3>
      <input id="search" type="text" placeholder="Search files...">
      <div id="fileList"></div>
    </section>
  </main>

  <footer>Cloud Computing Mini Project</footer>
  <script src="script.js"></script>
</body>
</html>
